<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Meter Client</title>
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body>
<div class="container">
    <div class="header">
        <div class="header-content">
            <h1>Smart Meter Monitor</h1>
            <div class="meter-id" id="meter-id">Initializing...</div>
        </div>
        <div class="status-badge disconnected" id="status">
            <span class="status-dot"></span>
            Disconnected
        </div>
    </div>

    <div class="info-grid">
        <div class="info-item">
            <div class="info-label">Region</div>
            <div class="info-value" id="region">-</div>
        </div>
        <div class="info-item">
            <div class="info-label">Client Name</div>
            <div class="info-value" id="client-name">-</div>
        </div>
    </div>

    <div class="reading-section">
        <div class="reading-card">
            <div class="card-label">Current Reading</div>
            <div class="card-value" id="reading">0.000</div>
            <div class="card-unit">kWh</div>
        </div>

        <div class="reading-card bill-card">
            <div class="card-label">Current Bill</div>
            <div class="card-value bill-value" id="bill">£0.00</div>
        </div>
    </div>

    <div class="stats-section">
        <div class="stat-item">
            <div class="stat-label">Readings Sent</div>
            <div class="stat-value" id="readings-sent">0</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Session Time</div>
            <div class="stat-value" id="session-time">0:00</div>
        </div>
        <div class="stat-item">
            <div class="stat-label">Last Update</div>
            <div class="stat-value" id="last-update">-</div>
        </div>
    </div>

    <div class="notification error" id="error">
        <div class="notification-text" id="error-text"></div>
    </div>

    <div class="notification alert" id="alert">
        <div class="notification-text" id="alert-text"></div>
    </div>
</div>

<script type="module" src="ui/renderer.js"></script>
</body>
</html>
